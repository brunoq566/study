// ─── GRADE SEMANAL (PDF plano_final) ─────────────────────────────────────────
// Semana única, todas as matérias em 7 dias
// 2 matérias/dia (Seg–Sab) | 3 matérias no Domingo (+40min para a 3ª)
// Tempos por dia (líquidos, sem intervalos):
//   Dias normais (2 mat.): Lei Seca 2×30=60 | Doutrina 2×40=80 | Info 20+15=35 | Questões 45 | Anki 20 → 240min
//   Domingo   (3 mat.):    Lei Seca 3×30=90 | Doutrina 3×40=120 | Info 3×(20+15)=105 | Questões 3×45=135... 
//   Na prática o PDF define +40min para a 3ª matéria → target domingo = 240 + 40 = 280min
const WEEKLY_SCHEDULE = {
  1: { mat1:'Processo Civil', mat2:'Eleitoral' },                        // Segunda
  2: { mat1:'Administrativo', mat2:'Penal Especial' },                   // Terça
  3: { mat1:'Processo Penal', mat2:'ECA' },                              // Quarta
  4: { mat1:'Direitos Humanos', mat2:'Tributário' },                     // Quinta
  5: { mat1:'Penal', mat2:'Empresarial' },                               // Sexta
  6: { mat1:'Civil', mat2:'Ambiental', mat3:'Súmulas' },                 // Sábado (3 matérias)
  0: { mat1:'Constitucional', mat2:'Consumidor', mat3:'Humanística' },   // Domingo (3 matérias)
};

// Minutos por tipo de atividade (por matéria individual), conforme o PDF
// Lei Seca: 30min/mat | Doutrina: 40min/mat | Info1: 20min/mat | Info2: 15min/mat | Questões: 45min (global) | Anki: 20min (global)
const MINS_PER = {
  lei_seca: 30,
  doutrina: 40,
  info1:    20,
  info2:    15,
  questoes: 45,
  anki:     20,
};

function getScheduleInfo(date) {
  const dow = date.getDay();
  return WEEKLY_SCHEDULE[dow] || WEEKLY_SCHEDULE[1];
}
function hasThirdSubject(date) {
  return !!getScheduleInfo(date).mat3;
}

// Gera lista de atividades individualizadas: uma por matéria x tipo + globais
function getActivities(date) {
  const s = getScheduleInfo(date);
  const mats = [s.mat1, s.mat2, s.mat3].filter(Boolean);
  const acts = [];
  // Lei Seca — uma por matéria (30 min cada)
  mats.forEach((mat, i) => acts.push({ id:`lei_seca_${i+1}`, group:'lei_seca',  name:`Lei Seca — ${mat}`,  emoji:'📖', target_min: MINS_PER.lei_seca }));
  // Doutrina — uma por matéria (40 min cada)
  mats.forEach((mat, i) => acts.push({ id:`doutrina_${i+1}`, group:'doutrina',  name:`Doutrina — ${mat}`,  emoji:'🎯', target_min: MINS_PER.doutrina }));
  // Informativos — apenas 2: Informativo 1 (mat1, 20min) e Informativo 2 (mat2, 15min)
  acts.push({ id:'info_1', group:'informativos', name:`Informativo 1 — ${s.mat1}`, emoji:'📰', target_min: MINS_PER.info1 });
  acts.push({ id:'info_2', group:'informativos', name:`Informativo 2 — ${s.mat2}`, emoji:'📄', target_min: MINS_PER.info2 });
  // Questões e Anki — globais
  acts.push({ id:'questoes', group:'questoes', name:'Questões', emoji:'✏️', target_min: MINS_PER.questoes });
  acts.push({ id:'anki',     group:'anki',     name:'Anki',     emoji:'🃏', target_min: MINS_PER.anki });
  return acts;
}
function getDailyTarget(date) {
  const s = getScheduleInfo(date);
  const n = [s.mat1, s.mat2, s.mat3].filter(Boolean).length;
  // lei_seca + doutrina por matéria; info fixo (20+15); globais (45+20)
  return n * (MINS_PER.lei_seca + MINS_PER.doutrina) + MINS_PER.info1 + MINS_PER.info2 + MINS_PER.questoes + MINS_PER.anki;
  // 2 mat = 2*70+35+65 = 240 min | 3 mat = 3*70+35+65 = 310 min
}
function dateToKey(date) {
  return `study:${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
}
function keyToDate(key) {
  const [y,m,d] = key.replace('study:','').split('-').map(Number);
  return new Date(y, m-1, d);
}
function formatDateBR(date) {
  const wd=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
  const mo=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  return `${wd[date.getDay()]}, ${date.getDate()} de ${mo[date.getMonth()]}. de ${date.getFullYear()}`;
}
function formatMonthBR(y, m) {
  const mo=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  return `${mo[m]} ${y}`;
}
function formatDur(min) {
  const h=Math.floor(min/60), m=min%60;
  if(!h) return `${m}min`; if(!m) return `${h}h`; return `${h}h ${m}min`;
}
function formatDurLong(min) {
  const h=Math.floor(min/60), m=min%60;
  if(!h) return `${m} min`; if(!m) return `${h}h`; return `${h}h ${m}min`;
}
function formatStatDur(min) {
  if (min < 60) return `${min}min`;
  const h=Math.floor(min/60), m=min%60;
  if (m===0) return `${h}h`;
  return `${h}h ${m}min`;
}

// ─── STORAGE (idb-keyval) ────────────────────────────────────────────────────
const _idb = (() => {
  // idb-keyval exposes either idbKeyval (UMD global) or individual named exports
  const lib = window.idbKeyval;
  if (lib) return lib;
  // fallback shim using localStorage
  return {
    get: async k => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : undefined; } catch { return undefined; } },
    set: async (k,v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
    keys: async () => { try { return Object.keys(localStorage); } catch { return []; } },
    del: async k => { try { localStorage.removeItem(k); } catch {} },
    clear: async () => { try { localStorage.clear(); } catch {} },
    entries: async () => { try { return Object.keys(localStorage).map(k => [k, JSON.parse(localStorage.getItem(k))]); } catch { return []; } },
  };
})();

const DB = {
  async get(k)    { try { return (await _idb.get(k)) ?? null; }    catch { return null; } },
  async set(k,v)  { try { await _idb.set(k, v); }                  catch {} },
  async keys()    { try { return await _idb.keys(); }               catch { return []; } },
  async remove(k) { try { await _idb.del(k); }                     catch {} },
  async clear()   { try { await _idb.clear(); }                    catch {} },
  async entries() { try { return await _idb.entries(); }           catch { return []; } },
};

async function computeStreak() {
  const today = new Date(); let streak=0;
  const d = new Date(today);
  while(streak<366){
    const data=await DB.get(dateToKey(d));
    if(!data||!data.activities||data.activities.every(a=>(a.done_min||0)===0)) break;
    streak++; d.setDate(d.getDate()-1);
  }
  return streak;
}
async function computeLongestStreak() {
  const keys = await DB.keys();
  const studyDates = keys.filter(k=>k.startsWith('study:20')).map(k=>keyToDate(k)).sort((a,b)=>a-b);
  let longest=0, cur=0, prev=null;
  for (const d of studyDates) {
    const data = await DB.get(dateToKey(d));
    if (!data?.activities?.some(a=>(a.done_min||0)>0)) { cur=0; prev=null; continue; }
    if (prev) {
      const diff = Math.round((d-prev)/86400000);
      cur = diff===1 ? cur+1 : 1;
    } else { cur=1; }
    if(cur>longest) longest=cur;
    prev=d;
  }
  return longest;
}

  // [ls1,ls2,d1,d2,i1_1,i1_2,i2_1,i2_2,questoes,anki] para 2 matérias (10 atividades)
  // [ls1,ls2,ls3,d1,d2,d3,i1_1,i1_2,i1_3,i2_1,i2_2,i2_3,questoes,anki] para 3 mat (14)
  const rows=[
    ["2026-04-18",[25,20,10,35,40,0,18,12,0,12,10,0,35,18],0], // Sáb 3mat
    ["2026-04-19",[30,25,20,40,35,30,20,18,12,15,12,10,40,18],0], // Dom 3mat
    ["2026-04-20",[30,25,40,0,20,15,15,0,40,18],0], // Seg 2mat
    ["2026-04-21",[30,30,30,35,20,18,15,12,40,15],0], // Ter 2mat
    ["2026-04-22",[0,25,30,30,18,20,12,15,40,15],0], // Qua 2mat
    ["2026-04-23",[30,25,40,35,20,15,15,12,35,20],0], // Qui 2mat
    ["2026-04-24",[30,25,0,35,18,12,12,0,30,15],0], // Sex 2mat
    ["2026-04-25",[30,25,20,40,35,30,20,18,12,15,12,10,45,18],0], // Sáb 3mat
    ["2026-04-26",[20,25,15,35,40,25,18,20,10,12,15,8,30,15],0], // Dom 3mat
    ["2026-04-27",[30,25,40,35,20,15,15,12,45,18],0], // Seg 2mat
    ["2026-04-28",[30,30,40,35,20,18,15,12,45,15],0], // Ter 2mat
    ["2026-04-29",[0,20,30,0,15,0,12,0,0,15],0], // Qua 2mat
  ];
  for(const [ds,mins,bonus] of rows){
    const [y,mo,d]=ds.split('-').map(Number);
    const date=new Date(y,mo-1,d);
    const acts=getActivities(date).map((a,i)=>({...a,done_min:mins[i]||0}));
    await DB.set(`study:${ds}`,{activities:acts,bonus_min:bonus});
  }
  await DB.set('study:seed_planilha_v4',true);
}

// ─── CIRCULAR PROGRESS ───────────────────────────────────────────────────────
function CircularProgress({ pct, total, target, done, C }) {
  const r = 70, stroke = 8;
  const circ = 2 * Math.PI * r;
  const offset = circ * (1 - Math.min(1, pct / 100));
  const color = pct >= 100 ? C.success : pct >= 50 ? C.accent : C.warning;
  return (
    <div style={{ position:'relative', width:176, height:176, flexShrink:0 }}>
      <svg width={176} height={176} style={{ transform:'rotate(-90deg)' }}>
        <circle cx={88} cy={88} r={r} fill="none" stroke={C.border} strokeWidth={stroke} />
        <circle
          cx={88} cy={88} r={r} fill="none"
          stroke={color} strokeWidth={stroke}
          strokeLinecap="round"
          strokeDasharray={circ}
          strokeDashoffset={offset}

// ─── DONUT CHART ─────────────────────────────────────────────────────────────
function DonutChart({ data, C }) {
  const [tip, setTip] = useState(null);
  const total = data.reduce((s,d)=>s+d.value,0);
  if(!total) return null;
  const cx=100,cy=100,ro=78,ri=46; let angle=-Math.PI/2;
  const slices=data.map((d,i)=>{
    const sw=(d.value/total)*2*Math.PI, a1=angle, a2=angle+sw;
    const lg=sw>Math.PI?1:0;
    const path=`M${cx+ro*Math.cos(a1)},${cy+ro*Math.sin(a1)} A${ro},${ro},0,${lg},1,${cx+ro*Math.cos(a2)},${cy+ro*Math.sin(a2)} L${cx+ri*Math.cos(a2)},${cy+ri*Math.sin(a2)} A${ri},${ri},0,${lg},0,${cx+ri*Math.cos(a1)},${cy+ri*Math.sin(a1)} Z`;
    angle=a2;
    return {path,color:PIE_COLORS[i%PIE_COLORS.length],name:d.name,value:d.value};
  });
  const active=tip!==null?slices[tip]:null;
  return (
    <div style={{display:'flex',flexWrap:'wrap',gap:24,alignItems:'center'}}>
      <svg width={cx*2} height={cy*2} style={{flexShrink:0}}>
        {slices.map((s,i)=>(
          <path key={i} d={s.path} fill={s.color} opacity={tip!==null&&tip!==i?0.35:1}
            onMouseEnter={()=>setTip(i)} onMouseLeave={()=>setTip(null)} style={{cursor:'pointer',transition:'opacity .15s'}}/>
        ))}
        {active ? (<>
          <text x={cx} y={cy-12} textAnchor="middle" fontSize="10" fill={C.textMid}>{active.name.split(' ').slice(0,2).join(' ')}</text>
          <text x={cx} y={cy+8}  textAnchor="middle" fontSize="14" fontWeight="800" fill={C.text}>{formatDur(active.value)}</text>
          <text x={cx} y={cy+24} textAnchor="middle" fontSize="11" fill={C.textMid}>{Math.round(active.value/total*100)}%</text>
        </>) : (<>
          <text x={cx} y={cx-4}  textAnchor="middle" fontSize="11" fill={C.textMid}>Total</text>
          <text x={cx} y={cx+14} textAnchor="middle" fontSize="14" fontWeight="800" fill={C.text}>{formatDur(total)}</text>
        </>)}
      </svg>
      <div style={{display:'flex',flexDirection:'column',gap:6,flex:1,minWidth:140}}>
        {slices.map((s,i)=>(
          <div key={i} style={{display:'flex',alignItems:'center',gap:8,opacity:tip!==null&&tip!==i?0.4:1,transition:'opacity .15s',cursor:'pointer'}}
            onMouseEnter={()=>setTip(i)} onMouseLeave={()=>setTip(null)}>
            <div style={{width:8,height:8,borderRadius:2,background:s.color,flexShrink:0}}/>
            <span style={{fontSize:12,color:C.textMid,flex:1}}>{s.name}</span>
            <span style={{fontSize:12,color:C.text,fontWeight:700}}>{formatDur(s.value)}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

// ─── LINE CHART ──────────────────────────────────────────────────────────────
function LineChartSVG({ data, C, color='#3b82f6' }) {
  const [hover,setHover]=useState(null);
  if(data.length<2) return <div style={{color:C.textSub,fontSize:13,padding:'20px 0'}}>Dados insuficientes para exibir gráfico.</div>;
  const W=700,H=200,pL=14,pR=20,pT=24,pB=36;
  const vals=data.map(d=>d.val);
  const maxV=Math.max(...vals,0.1);
  const xOf=i=>pL+(i/(data.length-1))*(W-pL-pR);
  const yOf=v=>pT+(1-(v/maxV))*(H-pT-pB);
  const pts=data.map((_,i)=>`${xOf(i)},${yOf(vals[i])}`).join(' ');
  const area=`M${xOf(0)},${H-pB} `+data.map((_,i)=>`L${xOf(i)},${yOf(vals[i])}`).join(' ')+` L${xOf(data.length-1)},${H-pB} Z`;
  return (
    <div style={{width:'100%',overflowX:'auto'}}>
      <svg width="100%" viewBox={`0 0 ${W} ${H}`} style={{display:'block'}}>
        {[0,.33,.66,1].map(t=>{
          const y=pT+(1-t)*(H-pT-pB);
          return <g key={t}>
            <line x1={pL} x2={W-pR} y1={y} y2={y} stroke={C.border} strokeDasharray="4,4"/>
            <text x={pL} y={y-4} fontSize="10" fill={C.textSub}>{+(maxV*t).toFixed(1)}</text>
          </g>;
        })}
        <defs>
          <linearGradient id={`lg-${color}`} x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor={color} stopOpacity="0.18"/>
            <stop offset="100%" stopColor={color} stopOpacity="0"/>
          </linearGradient>
        </defs>
        <path d={area} fill={`url(#lg-${color})`}/>
        <polyline points={pts} fill="none" stroke={color} strokeWidth="2" strokeLinejoin="round"/>
        {data.map((d,i)=>(
          <g key={i} onMouseEnter={()=>setHover(i)} onMouseLeave={()=>setHover(null)} style={{cursor:'pointer'}}>
            <circle cx={xOf(i)} cy={yOf(vals[i])} r={hover===i?5:3} fill={color} stroke={C.surface} strokeWidth="2"/>
            {hover===i&&<>
              <rect x={xOf(i)-34} y={yOf(vals[i])-38} width={68} height={26} rx={6} fill={C.surfaceEl} stroke={color} strokeWidth="1"/>
              <text x={xOf(i)} y={yOf(vals[i])-20} textAnchor="middle" fontSize="12" fontWeight="700" fill={color}>{d.label}</text>
            </>}
            {d.tick&&<text x={xOf(i)} y={H-8} textAnchor="middle" fontSize="10" fill={C.textSub}>{d.tick}</text>}
          </g>
        ))}
      </svg>
    </div>
  );
}

// ─── HEATMAP ─────────────────────────────────────────────────────────────────
function HeatmapChart({ data, C, startDate, endDate }) {
  const today = new Date();
  const end = endDate && endDate <= today ? endDate : today;
  const start = startDate || (() => { const d = new Date(end); d.setDate(end.getDate() - 90); return d; })();
  const totalDays = Math.max(1, Math.round((end - start) / 86400000) + 1);
  const days = [];
  for (let i = 0; i < totalDays; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const key = dateToKey(d);
    const row = data.find(r => dateToKey(r.date) === key);
    const done = row?.activities?.reduce((s, a) => s + (a.done_min || 0), 0) || 0;
    const target = row ? getDailyTarget(row.date) : 150;
    const pct = done > 0 ? Math.min(100, Math.round((done / target) * 100)) : 0;
    days.push({ date: d, done, pct, isFuture: d > today });
  }
  const padBefore = (start.getDay() + 6) % 7;
  const paddedDays = [...Array(padBefore).fill(null), ...days];
  const cellSize = 26, gap = 5;
  function cellColor(pct, isFuture) {
    if (isFuture) return 'transparent';
    if (pct === 0) return C.border;
    if (pct >= 100) return C.success;
    if (pct >= 75) return '#84cc16';
    if (pct >= 50) return C.warning;
    return C.danger;
  }
  const wdLabels = ['S','T','Q','Q','S','S','D'];
  return (
    <div>
      <div style={{ display:'flex', gap:`${gap}px`, justifyContent:'center', marginBottom:14, flexWrap:'wrap' }}>
        {wdLabels.map((label, i) => (
          <div key={i} style={{ width:`${cellSize}px`, textAlign:'center', fontSize:11, fontWeight:700, color:C.textSub }}>{label}</div>
        ))}
      </div>
      <div style={{ display:'grid', gridTemplateColumns:`repeat(7, ${cellSize}px)`, gap:`${gap}px`, justifyContent:'center', marginBottom:16 }}>
        {paddedDays.map((d, i) => {
          if (!d) return <div key={`pad-${i}`} style={{ width:`${cellSize}px`, height:`${cellSize}px` }} />;
          return (
            <div key={`cell-${i}`}
              style={{ width:`${cellSize}px`, height:`${cellSize}px`, borderRadius:6, background:cellColor(d.pct, d.isFuture), cursor:'pointer', transition:'all 0.15s', border: d.isFuture ? `1px solid ${C.border}` : 'none' }}
              title={`${d.date.toLocaleDateString('pt-BR')}: ${d.done}min (${d.pct}%)`}
              onMouseEnter={e=>{ e.currentTarget.style.transform='scale(1.2)'; e.currentTarget.style.zIndex='2'; }}
              onMouseLeave={e=>{ e.currentTarget.style.transform='scale(1)'; e.currentTarget.style.zIndex='1'; }}
            />
          );
        })}
      </div>
      <div style={{ display:'flex', gap:14, flexWrap:'wrap', justifyContent:'center' }}>
        {[[C.success,'100%'],['#84cc16','75–99%'],[C.warning,'50–74%'],[C.danger,'<50%'],[C.border,'0']].map(([c,l]) => (
          <div key={l} style={{ display:'flex', alignItems:'center', gap:5 }}>
            <div style={{ width:12, height:12, borderRadius:3, background:c }} />
            <span style={{ fontSize:11, color:C.textSub }}>{l}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

// ─── ACTIVITY ROW ─────────────────────────────────────────────────────────────
function ActivityRow({ act, value, onChange, C }) {
  // elapsed em segundos (crescente), totalTarget em segundos
  const totalTarget = act.target_min * 60;
  const [running, setRunning]     = useState(false);
  const [elapsed, setElapsed]     = useState(0);   // segundos já contados nesta sessão
  const [finished, setFinished]   = useState(false);
  const iv   = useRef(null);
  const startRef = useRef(null);

  useEffect(() => () => { clearInterval(iv.current); }, []);

  // restante = target - elapsed (countdown)
  const remaining = Math.max(0, totalTarget - elapsed);
  const remMin = Math.floor(remaining / 60);
  const remSec = remaining % 60;
  const elapsedMin = Math.floor(elapsed / 60);

  function startTimer() {
    setFinished(false);
    setRunning(true);
    startRef.current = Date.now() - elapsed * 1000;
    iv.current = setInterval(() => {
      const newElapsed = Math.floor((Date.now() - startRef.current) / 1000);
      setElapsed(newElapsed);
      if (newElapsed >= totalTarget) {
        clearInterval(iv.current);
        setRunning(false);
        setFinished(true);
        // notificação sonora simples
        try { const ctx=new AudioContext(); const o=ctx.createOscillator(); const g=ctx.createGain(); o.connect(g); g.connect(ctx.destination); o.frequency.value=880; g.gain.setValueAtTime(0.3,ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.8); o.start(); o.stop(ctx.currentTime+0.8); } catch{}
        onChange(Math.max(value, act.target_min));
      }
    }, 500);
  }

  function pauseTimer() {
    clearInterval(iv.current);
    setRunning(false);
    // acumula o tempo parcial no campo
    if (elapsedMin > 0) onChange(Math.max(value, elapsedMin));
  }

  function resetTimer() {
    clearInterval(iv.current);
    setRunning(false);
    setElapsed(0);
    setFinished(false);
  }

  function toggle() { running ? pauseTimer() : startTimer(); }

  const pct = act.target_min > 0 ? Math.min(100, Math.round((value / act.target_min) * 100)) : 0;
  const accentColor = finished ? C.success : value === 0 ? C.border : pct >= 100 ? C.success : pct >= 50 ? C.accent : C.warning;
  const timerColor  = finished ? C.success : remaining < 60 ? C.danger : running ? C.accent : C.textMid;
  const gc = groupColor(act.group||act.id);

  // Porcentagem do countdown (quanto do timer já passou)
  const timerPct = totalTarget > 0 ? Math.min(100, Math.round((elapsed / totalTarget) * 100)) : 0;

  return (
    <div className="act-row" style={{ borderLeftColor: gc }}>
      <div style={{ flex:1, display:'flex', flexDirection:'column', gap:6 }}>
        <div style={{ display:'flex', alignItems:'center', gap:8 }}>
          <span style={{ fontSize:15 }}>{act.emoji}</span>
          <span style={{ fontSize:14, fontWeight:600, color:C.text }}>{act.name}</span>
          <span style={{ fontSize:11, color:C.textSub, marginLeft:'auto' }}>meta {act.target_min} min</span>
        </div>
        <div style={{ display:'flex', alignItems:'center', gap:10 }}>
          <div style={{ flex:1, height:4, background:C.border, borderRadius:2, overflow:'hidden' }}>
            <div style={{ height:'100%', background:accentColor, width:`${pct}%`, borderRadius:2, transition:'width 0.4s' }}/>
          </div>
          {(running || elapsed > 0) && (
            <div style={{ width:80, height:4, background:C.border, borderRadius:2, overflow:'hidden', flexShrink:0 }}>
              <div style={{ height:'100%', background: finished?C.success:timerColor, width:`${timerPct}%`, borderRadius:2, transition:'width 0.5s' }}/>
            </div>
          )}
          <span style={{ fontSize:12, color:accentColor, fontWeight:700, minWidth:34, textAlign:'right' }}>{pct}%</span>
        </div>
      </div>
      <div style={{ display:'flex', alignItems:'center', gap:8, flexShrink:0 }}>
        {/* Countdown display */}
        <div style={{ background:C.bg, border:`1px solid ${running?timerColor:C.border}`, borderRadius:8,
          padding:'3px 9px', minWidth:68, textAlign:'center', transition:'border-color 0.3s',
          boxShadow: running ? `0 0 0 2px ${timerColor}22` : 'none' }}>
          <span style={{ fontSize:12, fontWeight:800, color:timerColor, fontVariantNumeric:'tabular-nums' }}>
            {finished ? '✓ OK' : `${String(remMin).padStart(2,'0')}:${String(remSec).padStart(2,'0')}`}
          </span>
        </div>
        {/* Play/Pause */}
        <button onClick={toggle}
          style={{ background: running ? C.warning : finished ? C.success : C.accent,
            border:'none', borderRadius:7, width:30, height:30,
            cursor:'pointer', color:'#fff', fontSize:12,
            display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0,
            transition:'background 0.2s' }}>
          {running ? '⏸' : '▶'}
        </button>
        {/* Reset — só quando há progresso */}
        {(elapsed > 0 || finished) && (
          <button onClick={resetTimer} title="Reiniciar"
            style={{ background:'none', border:`1px solid ${C.border}`, borderRadius:7, width:30, height:30,
              cursor:'pointer', color:C.textSub, fontSize:13,
              display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 }}>
            ↺
          </button>
        )}
        <input type="number" min={0} max={999} value={value===0?'':value} placeholder="0"
          onChange={e => onChange(Math.max(0, parseInt(e.target.value)||0))}
          style={{ width:58, padding:'5px 8px', background:C.bg, border:`1px solid ${C.border}`, borderRadius:8,
            color:C.text, fontSize:14, fontWeight:700, textAlign:'center', outline:'none', fontFamily:'inherit' }}/>
        <span style={{ fontSize:11, color:C.textSub }}>min</span>
      </div>
    </div>
  );
}

// ─── TODAY SCREEN ─────────────────────────────────────────────────────────────
function TodayScreen({ C, dark }) {
  const today = new Date();
  const todayKey = dateToKey(today);
  const sched = getScheduleInfo(today);
  const tmpl = getActivities(today);
  const target = getDailyTarget(today);
  const [acts, setActs] = useState(tmpl.map(a => ({...a, done_min:0})));
  const [bonus, setBonus] = useState(0);
  const [streak, setStreak] = useState(0);
  const [saved, setSaved] = useState(false);
  const [banner, setBanner] = useState(null);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    (async () => {
      const data = await DB.get(todayKey);
      if (data?.activities) {
        setActs(tmpl.map(t => { const f=data.activities.find(a=>a.id===t.id); return {...t, done_min:f?.done_min||0}; }));
        setBonus(data.bonus_min||0);
      }
      setStreak(await computeStreak());
      const y1=new Date(today); y1.setDate(today.getDate()-1);
      const y2=new Date(today); y2.setDate(today.getDate()-2);
      const d1=await DB.get(dateToKey(y1)), d2=await DB.get(dateToKey(y2));
      const noRecent=(!d1||d1.activities.every(a=>(a.done_min||0)===0))&&(!d2||d2.activities.every(a=>(a.done_min||0)===0));
      if (noRecent) setBanner(BANNERS[Math.floor(Math.random()*BANNERS.length)]);
      setLoading(false);
    })();
  }, []);

  const total = acts.reduce((s,a) => s+(a.done_min||0), 0);
  const pct = Math.min(100, Math.round((total/target)*100));
  const remaining = Math.max(0, target - total);
  const statusLabel = pct >= 100 ? 'Meta batida ✓' : pct >= 66 ? 'Quase lá!' : pct >= 33 ? 'Em progresso' : 'Em foco';
  const statusColor = pct >= 100 ? C.success : pct >= 66 ? C.warning : C.accent;

function CalendarScreen({ C }) {
  const today = new Date();
  const [vy,setVY] = useState(today.getFullYear());
  const [vm,setVM] = useState(today.getMonth());
  const [dayData,setDayData] = useState({});
  const [editDay,setEditDay] = useState(null);
  const [editVals,setEditVals] = useState({});
  const [editBonus,setEditBonus] = useState(0);
  const [saving,setSaving] = useState(false);

  useEffect(() => { loadMonth(vy,vm); }, [vy,vm]);

  async function loadMonth(y,m) {
    const keys=await DB.keys(); const data={};
    for(const k of keys.filter(k=>k.startsWith('study:20'))){
      const d=keyToDate(k);
      if(d.getFullYear()===y&&d.getMonth()===m){const v=await DB.get(k);if(v)data[k]=v;}
    }
    setDayData(data);
  }

  function status(date){
    const data=dayData[dateToKey(date)];
    if(!data?.activities) return 'empty';
    const done=data.activities.reduce((s,a)=>s+(a.done_min||0),0);
    const p=done/getDailyTarget(date);
    if(p>=1) return 'full'; if(p>=0.5) return 'partial'; if(done>0) return 'low'; return 'empty';
  }
  function statusClr(st,isFuture){
    if(isFuture) return 'transparent';
    return {full:C.success, partial:C.warning, low:C.danger, empty:C.border}[st];
  }

  function openDay(date){
    if(date>today) return;
    const k=dateToKey(date), data=dayData[k], tmpl=getActivities(date);
    const acts=tmpl.map(t=>({...t,done_min:data?.activities?.find(a=>a.id===t.id)?.done_min||0}));
    const vals={}; acts.forEach(a=>{vals[a.id]=a.done_min;});
    setEditDay({date,k,acts,info:getScheduleInfo(date)});
    setEditVals(vals); setEditBonus(data?.bonus_min||0);
  }

  async function saveEdit(){
    setSaving(true);
    await DB.set(editDay.k, {activities:editDay.acts.map(a=>({...a,done_min:editVals[a.id]||0})),bonus_min:editBonus});
    await loadMonth(vy,vm); setSaving(false); setEditDay(null);
  }

  const dim=new Date(vy,vm+1,0).getDate(), startWd=new Date(vy,vm,1).getDay();
  const wds=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];

  return (
    <div className="fade-in" style={{ padding:'36px 40px', maxWidth:860, margin:'0 auto', width:'100%' }}>
      <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:28 }}>
        <h1 style={{ fontSize:24, fontWeight:800, color:C.text }}>Calendário</h1>
        <div style={{ display:'flex', alignItems:'center', gap:12 }}>
          <button onClick={()=>{if(vm===0){setVM(11);setVY(y=>y-1);}else setVM(m=>m-1);}}
            style={{ background:C.surfaceEl, border:`1px solid ${C.border}`, borderRadius:8, width:36, height:36,
              color:C.text, cursor:'pointer', fontSize:18, display:'flex', alignItems:'center', justifyContent:'center' }}>‹</button>
          <span style={{ fontWeight:700, fontSize:17, color:C.text, minWidth:140, textAlign:'center' }}>{formatMonthBR(vy,vm)}</span>
          <button onClick={()=>{if(vm===11){setVM(0);setVY(y=>y+1);}else setVM(m=>m+1);}}
            style={{ background:C.surfaceEl, border:`1px solid ${C.border}`, borderRadius:8, width:36, height:36,
              color:C.text, cursor:'pointer', fontSize:18, display:'flex', alignItems:'center', justifyContent:'center' }}>›</button>
        </div>
      </div>

      {/* Legend */}
      <div style={{ display:'flex', gap:16, marginBottom:20, flexWrap:'wrap' }}>
        {[[C.success,'≥100%'],[C.warning,'50–99%'],[C.danger,'<50%'],[C.border,'Sem registro']].map(([c,l])=>(
          <div key={l} style={{ display:'flex', alignItems:'center', gap:6 }}>
            <div style={{ width:12, height:12, borderRadius:3, background:c }}/><span style={{ fontSize:12, color:C.textSub }}>{l}</span>
          </div>
        ))}
      </div>

      {/* Calendar grid */}
      <div style={{ background:C.surface, border:`1px solid ${C.border}`, borderRadius:14, overflow:'hidden' }}>
        <div style={{ display:'grid', gridTemplateColumns:'repeat(7,1fr)', borderBottom:`1px solid ${C.border}` }}>
          {wds.map(w=><div key={w} style={{ padding:'10px 4px', textAlign:'center', fontSize:11, fontWeight:700, color:C.textSub }}>{w}</div>)}
        </div>
        <div style={{ display:'grid', gridTemplateColumns:'repeat(7,1fr)' }}>
          {Array.from({length:startWd},(_,i)=><div key={`e${i}`} style={{ borderTop:`1px solid ${C.border}` }}/>)}
          {Array.from({length:dim},(_,i)=>{
            const day=i+1, date=new Date(vy,vm,day);
            const isToday=date.toDateString()===today.toDateString();
            const isFuture=date>today&&!isToday;
            const st=status(date), clr=statusClr(st,isFuture);
            return (
              <div key={day} onClick={()=>openDay(date)}
                style={{ padding:'8px 4px', textAlign:'center', cursor:isFuture?'default':'pointer', borderTop:`1px solid ${C.border}`,
                  transition:'background 0.1s' }}
                onMouseEnter={e=>{ if(!isFuture) e.currentTarget.style.background=C.border+'44'; }}
                onMouseLeave={e=>{ e.currentTarget.style.background='transparent'; }}>
                <div style={{ width:36, height:36, margin:'0 auto', borderRadius:'50%', background:clr,
                  border:isToday?`2px solid ${C.accent}`:'none', display:'flex', alignItems:'center', justifyContent:'center',
                  fontSize:13, fontWeight:isToday?800:500,
                  color:isFuture?C.border:(st==='empty'?C.textSub:'#fff') }}>
                  {day}
                </div>
              </div>
            );
          })}
        </div>
      </div>

      {/* Edit modal */}
      {editDay && (
        <div style={{ position:'fixed', inset:0, background:'rgba(0,0,0,0.7)', zIndex:1000,
          display:'flex', alignItems:'center', justifyContent:'center', padding:16 }}
          onClick={e=>e.target===e.currentTarget&&setEditDay(null)}>
          <div style={{ background:C.surface, border:`1px solid ${C.border}`, borderRadius:16, width:'100%', maxWidth:420,
            padding:28, maxHeight:'85vh', overflowY:'auto' }}>
            <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:6 }}>
              <div>
                <div style={{ fontWeight:800, fontSize:16, color:C.text }}>
                  {editDay.date.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})}
                </div>
                <div style={{ fontSize:13, color:C.accent, fontWeight:600, marginTop:2 }}>
                  {editDay.info.mat3 ? `${editDay.info.mat1} · ${editDay.info.mat2} · ${editDay.info.mat3}` : `${editDay.info.mat1} · ${editDay.info.mat2}`}
                </div>
              </div>
              <button onClick={()=>setEditDay(null)} style={{ background:'none', border:'none', color:C.textSub, fontSize:24, cursor:'pointer', lineHeight:1 }}>×</button>
            </div>
            <div style={{ height:1, background:C.border, margin:'16px 0' }}/>
            {editDay.acts.map(act=>(
              <div key={act.id} style={{ display:'flex', alignItems:'center', gap:12, marginBottom:12 }}>
                <span style={{ fontSize:16 }}>{act.emoji}</span>
                <div style={{ flex:1 }}>
                  <div style={{ fontSize:13, fontWeight:600, color:C.text }}>{act.name}</div>
                  <div style={{ fontSize:11, color:C.textSub }}>Meta: {act.target_min} min</div>
                </div>
                <input type="number" min={0} max={999} value={editVals[act.id]===0?'':editVals[act.id]} placeholder="0"
                  onChange={e=>setEditVals(v=>({...v,[act.id]:Math.max(0,parseInt(e.target.value)||0)}))}
                  style={{ width:60, padding:'6px 8px', background:C.bg, border:`1px solid ${C.border}`, borderRadius:8,
                    color:C.text, fontSize:14, fontWeight:700, textAlign:'center', outline:'none', fontFamily:'inherit' }}/>
                <span style={{ fontSize:12, color:C.textSub }}>min</span>
              </div>
            ))}
            <div style={{ display:'flex', alignItems:'center', gap:12, padding:'10px 12px', background:`${C.purple}12`,
              borderRadius:10, border:`1px solid ${C.purple}33`, marginBottom:20 }}>
              <span style={{ fontSize:16 }}>🎓</span>
              <div style={{ flex:1 }}>
                <span style={{ fontSize:13, fontWeight:600, color:C.text }}>Aulas </span>
                <span style={{ background:C.purple, color:'#fff', fontSize:9, fontWeight:700, padding:'1px 6px', borderRadius:8 }}>BÔNUS</span>
              </div>
              <input type="number" min={0} max={999} value={editBonus===0?'':editBonus} placeholder="0"
                onChange={e=>setEditBonus(Math.max(0,parseInt(e.target.value)||0))}
                style={{ width:60, padding:'6px 8px', background:C.bg, border:`1px solid ${C.border}`, borderRadius:8,
                  color:C.text, fontSize:14, fontWeight:700, textAlign:'center', outline:'none', fontFamily:'inherit' }}/>
              <span style={{ fontSize:12, color:C.textSub }}>min</span>
            </div>
            <button onClick={saveEdit} disabled={saving}
              style={{ width:'100%', padding:13, background:C.accent, border:'none', borderRadius:10,
                color:'#fff', fontSize:15, fontWeight:700, cursor:'pointer', fontFamily:'inherit' }}>
              {saving?'Salvando…':'Salvar alterações'}
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

// ─── STATS SCREEN ─────────────────────────────────────────────────────────────
function StatsScreen({ C, dailyGoalOverride }) {
  const [period,setPeriod] = useState('30');
  const [customFrom,setCustomFrom] = useState('');
  const [customTo,setCustomTo] = useState(()=>new Date().toISOString().slice(0,10));
  const [allData,setAllData] = useState([]);
  const [loading,setLoading] = useState(true);
  const [longestStreak,setLongestStreak] = useState(0);
  const [currentStreak,setCurrentStreak] = useState(0);
  const today = new Date();

  function getTarget(date) {
    if (dailyGoalOverride) return hasThirdSubject(date) ? dailyGoalOverride.extra : dailyGoalOverride.normal;
    return getDailyTarget(date);
  }

  useEffect(()=>{
    (async()=>{
      const keys=await DB.keys(); const rows=[];
      for(const k of keys.filter(k=>k.startsWith('study:20'))){
        const v=await DB.get(k);
        if(v?.activities) rows.push({key:k,date:keyToDate(k),...v});
      }
      rows.sort((a,b)=>a.date-b.date);
      setAllData(rows);
      setCurrentStreak(await computeStreak());
      setLongestStreak(await computeLongestStreak());
      setLoading(false);
    })();
  },[]);

  function filterRows(rows){
    if(period==='custom'){
      const from=customFrom?new Date(customFrom+'T00:00:00'):null;
      const to=customTo?new Date(customTo+'T23:59:59'):today;
      return rows.filter(r=>(!from||r.date>=from)&&r.date<=to);
    }
    if(period==='all') return rows;
    const cut=new Date(today); cut.setDate(today.getDate()-parseInt(period));
    return rows.filter(r=>r.date>=cut);
  }

  function getPeriodBounds(){
    if(period==='custom'){
      const from=customFrom?new Date(customFrom+'T00:00:00'):null;
      const to=customTo?new Date(customTo+'T00:00:00'):today;
      return {start:from,end:to};
    }
    if(period==='all'){
      const earliest=allData.length>0?allData[0].date:today;
      return {start:earliest,end:today};
    }
    const start=new Date(today); start.setDate(today.getDate()-parseInt(period));
    return {start,end:today};
  }

  function periodLabel(){
    if(period==='custom'){
      const f=customFrom?new Date(customFrom+'T00:00:00').toLocaleDateString('pt-BR'):'início';
      const t=customTo?new Date(customTo+'T00:00:00').toLocaleDateString('pt-BR'):today.toLocaleDateString('pt-BR');
      return `${f} a ${t}`;
    }
    return {7:'últimos 7 dias',14:'últimos 14 dias',30:'últimos 30 dias',90:'últimos 90 dias',all:'todo o período'}[period];
  }

  const filtered=filterRows(allData);
  const {start:periodStart,end:periodEnd}=getPeriodBounds();
  const studied=filtered.filter(r=>r.activities.some(a=>(a.done_min||0)>0));
  const metDays=filtered.filter(r=>{const done=r.activities.reduce((s,a)=>s+(a.done_min||0),0); return done>=getTarget(r.date);});
  const totalMins=studied.reduce((s,r)=>s+r.activities.reduce((ss,a)=>ss+(a.done_min||0),0),0);
  const totalBonus=filtered.reduce((s,r)=>s+(r.bonus_min||0),0);
  const avgDaily=studied.length>0?Math.round(totalMins/studied.length):0;
  const avgBonus=studied.length>0?Math.round(totalBonus/studied.length):0;
  const consistency=filtered.length>0?Math.round((studied.length/filtered.length)*100):0;
  const metRate=studied.length>0?Math.round((metDays.length/studied.length)*100):0;

  const prevStats=useMemo(()=>{
    if(period==='all'||period==='custom') return null;
    const days=parseInt(period);
    const prevEnd=new Date(today); prevEnd.setDate(today.getDate()-days);
    const prevStart=new Date(today); prevStart.setDate(today.getDate()-days*2);
    const prevRows=allData.filter(r=>r.date>=prevStart&&r.date<prevEnd);
    const prevStudied=prevRows.filter(r=>r.activities.some(a=>(a.done_min||0)>0));
    const prevTotal=prevStudied.reduce((s,r)=>s+r.activities.reduce((ss,a)=>ss+(a.done_min||0),0),0);
    const prevAvg=prevStudied.length>0?Math.round(prevTotal/prevStudied.length):0;
    const prevMet=prevRows.filter(r=>{const d=r.activities.reduce((s,a)=>s+(a.done_min||0),0);return d>=getTarget(r.date);});
    return {total:prevTotal,avg:prevAvg,days:prevStudied.length,met:prevMet.length};
  },[allData,period,today]);

  function trendArrow(curr,prev){
    if(prev===null||prev===undefined) return null;
    if(prev===0) return curr>0?{arrow:'↑',pct:100,color:C.success}:null;
    const pct=Math.round(((curr-prev)/prev)*100);
    if(Math.abs(pct)<=5) return {arrow:'→',pct:Math.abs(pct),color:C.warning};
    return pct>0?{arrow:'↑',pct,color:C.success}:{arrow:'↓',pct:Math.abs(pct),color:C.danger};
  }

  const tTotal=prevStats?trendArrow(totalMins,prevStats.total):null;
  const tAvg=prevStats?trendArrow(avgDaily,prevStats.avg):null;
  const tDays=prevStats?trendArrow(studied.length,prevStats.days):null;
  const tMet=prevStats?trendArrow(metDays.length,prevStats.met):null;

  // subMap: tempo por matéria — extrai matéria do nome da atividade ("Lei Seca — Civil" → "Civil")
  const subMap={};
  for(const row of filtered){
    for(const a of row.activities){
      const m = a.name ? a.name.split(' — ')[1] : null;
      if(m) subMap[m]=(subMap[m]||0)+(a.done_min||0);
      else {
        // questoes e anki: atribui à mat1 do dia para estatística
        const s=getScheduleInfo(row.date);
        subMap[s.mat1]=(subMap[s.mat1]||0)+(a.done_min||0);
      }
    }
  }
  const subData=Object.entries(subMap).map(([name,value])=>({name,value})).filter(d=>d.value>0).sort((a,b)=>b.value-a.value);

  // actMap: agrega por grupo (lei_seca, doutrina, informativos, questoes, anki)
  const actMap={lei_seca:0,doutrina:0,informativos:0,questoes:0,anki:0,bonus:0};
  for(const row of filtered){
    for(const act of row.activities){
      const g = act.group || act.id;
      if(actMap[g]!==undefined) actMap[g]+=(act.done_min||0);
    }
    actMap.bonus+=(row.bonus_min||0);
  }
  const actData=Object.entries(actMap).filter(([,v])=>v>0)
    .map(([id,value])=>({id,name:ACT_LABELS[id]||id,value,color:ACT_COLORS_MAP[id]||'#64748b'}));

  const moNames=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  const moMap={};
  for(const row of allData){
    const mk=`${row.date.getFullYear()}-${String(row.date.getMonth()+1).padStart(2,'0')}`;
    if(!moMap[mk]) moMap[mk]={year:row.date.getFullYear(),month:row.date.getMonth(),mins:0,targetMins:0};
    moMap[mk].mins+=row.activities.reduce((s,a)=>s+(a.done_min||0),0);
  }
  for(const mk of Object.keys(moMap)){
    const {year,month}=moMap[mk];
    const dim=new Date(year,month+1,0).getDate();
    let tgt=0; for(let d=1;d<=dim;d++) tgt+=getTarget(new Date(year,month,d));
    moMap[mk].targetMins=tgt;
  }
  const moData=Object.entries(moMap).sort(([a],[b])=>a<b?-1:1).map(([mk,{year,month,mins,targetMins}])=>{
    const h=+(mins/60).toFixed(1),th=+(targetMins/60).toFixed(1);
    const pct=targetMins>0?Math.round((mins/targetMins)*100):0;
    const color=pct>=80?C.success:pct>=50?C.warning:C.danger;
    return {tick:`${moNames[month]}/${String(year).slice(2)}`,val:h,value:h,target:th,label:`${h}h`,color,pct};
  });
  const moAvgH=moData.length>0?+(moData.reduce((s,d)=>s+d.value,0)/moData.length).toFixed(1):0;
  const moAvgTarget=moData.length>0?+(moData.reduce((s,d)=>s+d.target,0)/moData.length).toFixed(1):0;
  const moAdh=moAvgTarget>0?Math.round((moAvgH/moAvgTarget)*100):0;

  const dayDataFiltered=(()=>{
    if(!periodStart||!periodEnd) return [];
    const totalDays=Math.round((periodEnd-periodStart)/86400000)+1;
    if(totalDays>60){
      const wkAgg={};
      for(let i=0;i<totalDays;i++){
        const d=new Date(periodStart);d.setDate(periodStart.getDate()+i);
        const mon=new Date(d);mon.setDate(d.getDate()-((d.getDay()+6)%7));
        const wk=`${mon.getDate()}/${mon.getMonth()+1}`;
        const row=filtered.find(r=>r.date.toDateString()===d.toDateString());
        const mins=row?.activities?.reduce((s,a)=>s+(a.done_min||0),0)||0;
        wkAgg[wk]=(wkAgg[wk]||0)+mins;
      }
      return Object.entries(wkAgg).map(([wk,mins])=>({tick:wk,val:mins,label:formatStatDur(mins)}));
    }
    const result=[];
    for(let i=0;i<totalDays;i++){
      const d=new Date(periodStart);d.setDate(periodStart.getDate()+i);
      const row=filtered.find(r=>r.date.toDateString()===d.toDateString());
      const mins=row?.activities?.reduce((s,a)=>s+(a.done_min||0),0)||0;
      const showTick=totalDays<=14||i%Math.max(1,Math.floor(totalDays/10))===0;
      result.push({tick:showTick?`${d.getDate()}/${d.getMonth()+1}`:'',val:mins,label:formatStatDur(mins)});
    }
    return result;
  })();

  const allSubj=[...new Set(Object.values(WEEKLY_SCHEDULE).flatMap(s=>[s.mat1,s.mat2,s.mat3].filter(Boolean)))];
  const sessCnt={};
  for(const row of filtered){
    if(row.activities.some(a=>(a.done_min||0)>0)){
      const s=getScheduleInfo(row.date);
      [s.mat1,s.mat2,s.mat3].filter(Boolean).forEach(m=>{ sessCnt[m]=(sessCnt[m]||0)+1; });
    }
  }
  const subjectConsistency=allSubj.map(subj=>{
    const possible=filtered.filter(r=>{const s=getScheduleInfo(r.date);return[s.mat1,s.mat2,s.mat3].filter(Boolean).includes(subj);}).length;
    const done=filtered.filter(r=>{const s=getScheduleInfo(r.date);return[s.mat1,s.mat2,s.mat3].filter(Boolean).includes(subj)&&r.activities.some(a=>(a.done_min||0)>0);}).length;
    const pct=possible>0?Math.round((done/possible)*100):0;
    return {name:subj,value:pct,label:`${pct}% (${done}/${possible})`,color:pct>=80?C.success:pct>=50?C.warning:C.danger};
  }).sort((a,b)=>b.value-a.value);

  const neglected=allSubj.filter(s=>(sessCnt[s]||0)<2).map(s=>({name:s,sessions:sessCnt[s]||0}));
  const avgDailyGoalNormal=dailyGoalOverride?.normal||150;

  function StatKpi({label,value,sub,color,trend}){
    return (
      <div style={{background:C.surfaceEl,border:`1px solid ${C.border}`,borderRadius:12,padding:'18px 20px'}}>
        <div style={{fontSize:26,fontWeight:800,color:color||C.text,lineHeight:1,display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'}}>
          {value}
          {trend&&<span style={{fontSize:11,fontWeight:700,color:trend.color,background:`${trend.color}22`,padding:'2px 7px',borderRadius:8}}>{trend.arrow} {trend.pct}%</span>}
        </div>
        <div style={{fontSize:12,color:C.textSub,marginTop:4,fontWeight:500}}>{label}</div>
        {sub&&<div style={{fontSize:11,color:C.textSub,opacity:0.7,marginTop:2}}>{sub}</div>}
      </div>
    );
  }

  function SCard({title,children}){
    return (
      <div className="card" style={{background:C.surface,border:`1px solid ${C.border}`}}>
        {title&&<div style={{fontWeight:700,fontSize:14,color:C.text,marginBottom:18,textTransform:'uppercase',letterSpacing:'0.06em',fontSize:11,color:C.textSub}}>{title}</div>}
        {children}
      </div>
    );
  }

  if(loading) return <div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'100%',color:C.textSub}}>Carregando...</div>;

  return (
    <div className="fade-in" style={{padding:'36px 40px',maxWidth:1100,margin:'0 auto',width:'100%'}}>

      {/* Period selector */}
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:28,flexWrap:'wrap',gap:12}}>
        <h1 style={{fontSize:24,fontWeight:800,color:C.text}}>Estatísticas</h1>
        <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
          {[['7','7d'],['14','14d'],['30','30d'],['90','90d'],['all','Tudo'],['custom','Custom']].map(([v,l])=>(
            <button key={v} onClick={()=>setPeriod(v)} className="period-tab"
              style={{background:period===v?C.accent:'transparent',border:`1px solid ${period===v?C.accent:C.border}`,color:period===v?'#fff':C.textMid}}>
              {l}
            </button>
          ))}
        </div>
      </div>

      {period==='custom'&&(
        <div style={{display:'flex',gap:10,alignItems:'center',flexWrap:'wrap',padding:'12px 16px',background:`${C.accent}0e`,borderRadius:10,border:`1px solid ${C.accent}22`,marginBottom:20}}>
          <div style={{display:'flex',alignItems:'center',gap:6}}>
            <span style={{fontSize:12,color:C.textSub,fontWeight:600}}>De:</span>
            <input type="date" value={customFrom} onChange={e=>setCustomFrom(e.target.value)}
              style={{padding:'5px 8px',borderRadius:7,border:`1px solid ${C.border}`,background:C.bg,color:C.text,fontSize:13,outline:'none',fontFamily:'inherit'}}/>
          </div>
          <div style={{display:'flex',alignItems:'center',gap:6}}>
            <span style={{fontSize:12,color:C.textSub,fontWeight:600}}>Até:</span>
            <input type="date" value={customTo} onChange={e=>setCustomTo(e.target.value)}
              style={{padding:'5px 8px',borderRadius:7,border:`1px solid ${C.border}`,background:C.bg,color:C.text,fontSize:13,outline:'none',fontFamily:'inherit'}}/>
          </div>
          {customFrom && customTo && (()=>{
            const from = new Date(customFrom+'T00:00:00');
            const to = new Date(customTo+'T23:59:59');
            const days = Math.round((to - from) / 86400000) + 1;
            return days > 0 ? (
              <div style={{display:'flex',alignItems:'center',gap:6,padding:'4px 12px',background:`${C.accent}18`,borderRadius:8,border:`1px solid ${C.accent}33`}}>
                <span style={{fontSize:13,fontWeight:700,color:C.accent}}>{days}</span>
                <span style={{fontSize:12,color:C.textMid}}>dia{days!==1?'s':''}</span>
              </div>
            ) : null;
          })()}
        </div>
      )}

      {/* KPI row */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:12,marginBottom:20}}>
        <StatKpi label="Total estudado" value={formatStatDur(totalMins)} trend={tTotal}/>
        <StatKpi label="Média diária" value={formatStatDur(avgDaily)} trend={tAvg}/>
        <StatKpi label="Dias estudados" value={studied.length} sub={`de ${filtered.length} dias`} trend={tDays}/>
        <StatKpi label="Meta batida" value={`${metRate}%`} color={C.success} sub={`${metDays.length} dias`} trend={tMet}/>
      </div>

      {/* Streak */}
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,marginBottom:20}}>
        <div style={{background:`${C.orange}12`,border:`1px solid ${C.orange}33`,borderRadius:14,padding:'20px 24px',display:'flex',alignItems:'center',gap:16}}>
          <span className="flame" style={{fontSize:36}}>🔥</span>
          <div>
            <div style={{fontSize:36,fontWeight:900,color:C.orange,lineHeight:1}}>{currentStreak}</div>
            <div style={{fontSize:12,color:C.textSub,marginTop:2}}>Streak atual (dias)</div>
          </div>
        </div>
        <div style={{background:`${C.success}12`,border:`1px solid ${C.success}33`,borderRadius:14,padding:'20px 24px',display:'flex',alignItems:'center',gap:16}}>
          <span style={{fontSize:36}}>🏆</span>
          <div>
            <div style={{fontSize:36,fontWeight:900,color:C.success,lineHeight:1}}>{longestStreak}</div>
            <div style={{fontSize:12,color:C.textSub,marginTop:2}}>Recorde pessoal (dias)</div>
          </div>
        </div>
      </div>

      {/* Consistency + met rate */}
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,marginBottom:20}}>
        <SCard title="Comparecimento">
          <div style={{fontSize:32,fontWeight:800,color:C.accent,marginBottom:6}}>{consistency}%</div>
          <div style={{height:6,background:C.border,borderRadius:3,overflow:'hidden'}}>
            <div style={{height:'100%',background:C.accent,width:`${consistency}%`,borderRadius:3}}/>
          </div>
          <div style={{fontSize:12,color:C.textSub,marginTop:6}}>{studied.length} de {filtered.length} dias</div>
        </SCard>
        <SCard title="Meta batida">
          <div style={{fontSize:32,fontWeight:800,color:C.success,marginBottom:6}}>{metRate}%</div>
          <div style={{height:6,background:C.border,borderRadius:3,overflow:'hidden'}}>
            <div style={{height:'100%',background:C.success,width:`${metRate}%`,borderRadius:3}}/>
          </div>
          <div style={{fontSize:12,color:C.textSub,marginTop:6}}>Nos dias estudados</div>
        </SCard>
      </div>

      {/* Bônus */}
      <div style={{background:`${C.purple}12`,border:`1px solid ${C.purple}33`,borderRadius:14,padding:'18px 24px',marginBottom:20,display:'flex',gap:32,flexWrap:'wrap'}}>
        <div>
          <div style={{fontSize:26,fontWeight:800,color:C.purple}}>{formatStatDur(totalBonus)}</div>
          <div style={{fontSize:12,color:C.textSub,marginTop:2}}>Total Aulas Assistidas</div>
        </div>
        <div style={{borderLeft:`1px solid ${C.purple}33`,paddingLeft:32}}>
          <div style={{fontSize:26,fontWeight:800,color:C.purple}}>{formatStatDur(avgBonus)}</div>
          <div style={{fontSize:12,color:C.textSub,marginTop:2}}>Média diária de aulas</div>
        </div>
      </div>

      {/* Heatmap */}
      <SCard title="Mapa de Atividade">
        <HeatmapChart data={filtered} C={C} startDate={periodStart} endDate={periodEnd}/>
      </SCard>

      {/* Daily chart */}
      <SCard title={dayDataFiltered.length>0&&Math.round((periodEnd-periodStart)/86400000)+1>60?'Minutos por semana':'Minutos por dia'}>
        <LineChartSVG data={dayDataFiltered} C={C} color={C.warning}/>
      </SCard>

      {/* Monthly bar */}
      {moData.length>0&&(
        <SCard title="Evolução Mensal">
          <VBarChart data={moData} C={C}/>
          <div style={{display:'flex',gap:20,marginTop:10,fontSize:12,color:C.textSub,flexWrap:'wrap'}}>
            <span>Média: <b style={{color:C.text}}>{moAvgH}h</b></span>
            <span>Meta média: <b style={{color:C.text}}>{moAvgTarget}h</b></span>
            <span>Aderência: <b style={{color:moAdh>=80?C.success:moAdh>=50?C.warning:C.danger}}>{moAdh}%</b></span>
          </div>
        </SCard>
      )}

      {/* Matérias */}
      {subData.length>0&&(
        <SCard title="Horas por Matéria">
          <DonutChart data={subData} C={C}/>
        </SCard>
      )}

      {/* Consistência por matéria */}
      <SCard title="Consistência por Matéria">
        <HBarChart data={subjectConsistency} C={C}/>
      </SCard>

      {/* Distribuição */}
      {actData.length>0&&(
        <SCard title="Distribuição por Tipo de Atividade">
          <HBarChart data={actData} C={C}/>
        </SCard>
      )}

      {/* Negligenciadas */}
      <SCard title="Matérias Negligenciadas">
        {neglected.length===0
          ?<div style={{color:C.success,fontSize:14,fontWeight:600}}>✓ Todas as matérias com bom histórico.</div>
          :<div style={{display:'flex',flexDirection:'column',gap:8}}>
            {neglected.map(({name,sessions})=>(
              <div key={name} style={{display:'flex',alignItems:'center',gap:10,padding:'8px 14px',background:`${C.danger}0e`,border:`1px solid ${C.danger}33`,borderRadius:8}}>
                <span style={{color:C.danger}}>⚠</span>
                <span style={{fontSize:13,fontWeight:600,color:C.danger,flex:1}}>{name}</span>
                <span style={{fontSize:11,color:C.textSub,background:`${C.danger}18`,padding:'2px 8px',borderRadius:10}}>{sessions} sessão(ões)</span>
              </div>
            ))}
          </div>
        }
      </SCard>
    </div>
  );
}

// ─── SETTINGS SCREEN ─────────────────────────────────────────────────────────
function SettingsScreen({ C, dark, onToggleDark, dailyGoalOverride, onSetDailyGoal, driveClientId, onSetDriveClientId }) {
  const [confirmClear,setConfirmClear] = useState(0);
  const [msg,setMsg] = useState('');
  const [goalInput,setGoalInput] = useState('');
  const [goalExtraInput,setGoalExtraInput] = useState('');
  const [clientIdInput,setClientIdInput] = useState(driveClientId||'171574938780-shmqfo6hqgel7k5vql9plf0qj561gh0h.apps.googleusercontent.com');
  const fileRef = useRef(null);

  function showMsg(m){ setMsg(m); setTimeout(()=>setMsg(''),3000); }

  useEffect(()=>{
    setGoalInput(String(dailyGoalOverride?.normal||150));
    setGoalExtraInput(String(dailyGoalOverride?.extra||185));
  },[dailyGoalOverride]);

  function saveGoal(){ const n=parseInt(goalInput)||150,e=parseInt(goalExtraInput)||185; onSetDailyGoal({normal:n,extra:e}); showMsg('Meta atualizada.'); }

  async function exportData(){
    const keys=await DB.keys(); const data={};
    for(const k of keys) data[k]=await DB.get(k);
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download=`magistratura-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(url);
    showMsg('Dados exportados.');
  }

  async function exportCSV(){
    const wd=['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
    const keys=await DB.keys();
    const studyKeys=keys.filter(k=>k.startsWith('study:20')).sort();
    const lines=['\uFEFFData,Dia da Semana,Matéria,Atividade,Meta (min),Feito (min),Tipo'];
    for(const k of studyKeys){
      const val=await DB.get(k); if(!val?.activities) continue;
      const date=keyToDate(k);
      const dateBR=`${String(date.getDate()).padStart(2,'0')}/${String(date.getMonth()+1).padStart(2,'0')}/${date.getFullYear()}`;
      for(const act of val.activities) lines.push(`${dateBR},${wd[date.getDay()]},"${getScheduleInfo(date).mat1}","${act.name}",${act.target_min||0},${act.done_min||0},Regular`);
      if((val.bonus_min||0)>0) lines.push(`${dateBR},${wd[date.getDay()]},"${getScheduleInfo(date).mat1}","Aulas Assistidas",0,${val.bonus_min},Bônus`);
    }
    const blob=new Blob([lines.join('\r\n')],{type:'text/csv;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download=`magistratura-historico-${new Date().toISOString().slice(0,10)}.csv`;a.click();URL.revokeObjectURL(url);
    showMsg('CSV exportado.');
  }

  async function handleImport(e){
    const file=e.target.files[0]; if(!file) return;
    try{const data=JSON.parse(await file.text());for(const[k,v]of Object.entries(data))await DB.set(k,v);showMsg('Importado! Recarregue a página.');}
    catch{showMsg('Erro ao importar.');}
    e.target.value='';
  }

  async function clearAll(){
    if(confirmClear<2){setConfirmClear(c=>c+1);return;}
    await DB.clear();setConfirmClear(0);showMsg('Dados removidos.');
  }

  function Row({label,desc,action,last}){
    return (
      <div style={{display:'flex',alignItems:'center',gap:16,padding:'16px 0',borderBottom:last?'none':`1px solid ${C.border}`}}>
        <div style={{flex:1}}>
          <div style={{fontSize:14,fontWeight:600,color:C.text}}>{label}</div>
          {desc&&<div style={{fontSize:12,color:C.textSub,marginTop:2}}>{desc}</div>}
        </div>
        {action}
      </div>
    );
  }

  const btnStyle=(variant='primary')=>({
    padding:'8px 18px', border:'none', borderRadius:8, fontSize:13, fontWeight:700, cursor:'pointer', fontFamily:'inherit',
    background: variant==='primary'?C.accent:variant==='success'?C.success:variant==='ghost'?'transparent':C.surfaceEl,
    color: variant==='ghost'?C.textMid:'#fff',
    border: variant==='ghost'?`1px solid ${C.border}`:'none',
  });

  return (
    <div className="fade-in" style={{padding:'36px 40px',maxWidth:640,margin:'0 auto',width:'100%'}}>
      <h1 style={{fontSize:24,fontWeight:800,color:C.text,marginBottom:28}}>Configurações</h1>

      {msg&&(
        <div style={{background:msg.includes('Erro')?`${C.danger}18`:`${C.success}18`,border:`1px solid ${msg.includes('Erro')?C.danger:C.success}44`,
          borderRadius:10,padding:'12px 16px',marginBottom:20,fontSize:14,fontWeight:600,color:msg.includes('Erro')?C.danger:C.success}}>
          {msg}
        </div>
      )}

      {/* Meta diária */}
      <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:14,padding:'20px 24px',marginBottom:14}}>
        <div style={{fontSize:11,fontWeight:700,color:C.textSub,textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:14}}>Meta Diária</div>
        <div style={{display:'flex',gap:20,flexWrap:'wrap',alignItems:'flex-end'}}>
          <div>
            <div style={{fontSize:12,color:C.textSub,marginBottom:6,fontWeight:600}}>Dia normal</div>
            <div style={{display:'flex',alignItems:'center',gap:8}}>
              <input type="number" min={30} max={480} value={goalInput} onChange={e=>setGoalInput(e.target.value)}
                style={{width:80,padding:'8px 10px',background:C.bg,border:`1px solid ${C.border}`,borderRadius:8,color:C.text,fontSize:15,fontWeight:700,textAlign:'center',outline:'none',fontFamily:'inherit'}}/>
              <span style={{fontSize:12,color:C.textSub}}>min</span>
            </div>
          </div>
          <div>
            <div style={{fontSize:12,color:C.textSub,marginBottom:6,fontWeight:600}}>Dia com extra</div>
            <div style={{display:'flex',alignItems:'center',gap:8}}>
              <input type="number" min={30} max={600} value={goalExtraInput} onChange={e=>setGoalExtraInput(e.target.value)}
                style={{width:80,padding:'8px 10px',background:C.bg,border:`1px solid ${C.border}`,borderRadius:8,color:C.text,fontSize:15,fontWeight:700,textAlign:'center',outline:'none',fontFamily:'inherit'}}/>
              <span style={{fontSize:12,color:C.textSub}}>min</span>
            </div>
          </div>
          <button onClick={saveGoal} style={btnStyle('primary')}>Salvar</button>
        </div>
      </div>

      {/* Google Drive */}
      <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:14,padding:'20px 24px',marginBottom:14}}>

      const today = new Date();
      const dayLabels = ['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
      const result = [];
      for (let i = 6; i >= 0; i--) {

        const done = data?.activities?.reduce((s,a) => s+(a.done_min||0),0) || 0;

// ─── GOOGLE DRIVE SYNC ──────────────────────────────────────────────────────
const DRIVE_FILE_NAME = 'magistratura-painel-backup.json';
const DRIVE_SCOPES = 'https://www.googleapis.com/auth/drive.file';

const GDrive = {
  _token: null,
  _clientId: null,

  init(clientId) {
    this._clientId = clientId;
    const saved = localStorage.getItem('gdrive_token');
    if (saved) {
      try {
        const t = JSON.parse(saved);
        if (t.expiry > Date.now()) { this._token = t; return true; }
      } catch {}
    }
    return false;
  },

  isConnected() { return !!this._token && this._token.expiry > Date.now(); },

  async requestToken() {
    return new Promise((resolve, reject) => {
      if (!this._clientId) { reject(new Error('Client ID não configurado')); return; }
      if (!window.google?.accounts?.oauth2) { reject(new Error('Google Identity Services não carregado')); return; }
      const client = window.google.accounts.oauth2.initTokenClient({
        client_id: this._clientId,
        scope: DRIVE_SCOPES,
        callback: (resp) => {
          if (resp.error) { reject(new Error(resp.error)); return; }
          const expiry = Date.now() + (resp.expires_in - 60) * 1000;
          this._token = { access_token: resp.access_token, expiry };
          localStorage.setItem('gdrive_token', JSON.stringify(this._token));
          resolve(this._token);
        },
      });
      client.requestAccessToken();
    });
  },

  disconnect() {
    if (this._token) {
      try { window.google?.accounts?.oauth2?.revoke(this._token.access_token, () => {}); } catch {}
    }
    this._token = null;
    localStorage.removeItem('gdrive_token');
  },

  async _fetch(url, opts = {}) {
    if (!this.isConnected()) throw new Error('Não conectado ao Google');
    const res = await fetch(url, {
      ...opts,
      headers: { 'Authorization': `Bearer ${this._token.access_token}`, ...(opts.headers || {}) },
    });
    if (!res.ok) throw new Error(`Drive API error: ${res.status}`);
    return res;
  },

  async findFile() {
    const q = encodeURIComponent(`name='${DRIVE_FILE_NAME}' and trashed=false`);
    const res = await this._fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name,modifiedTime)&spaces=drive`);
    const data = await res.json();
    return data.files?.[0] || null;
  },

  async downloadFile(fileId) {
    const res = await this._fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`);
    return await res.json();
  },

  async uploadFile(content, existingFileId = null) {
    const blob = new Blob([JSON.stringify(content, null, 2)], { type: 'application/json' });
    const meta = { name: DRIVE_FILE_NAME, mimeType: 'application/json' };
    const form = new FormData();
    form.append('metadata', new Blob([JSON.stringify(meta)], { type: 'application/json' }));
    form.append('file', blob);
    const url = existingFileId
      ? `https://www.googleapis.com/upload/drive/v3/files/${existingFileId}?uploadType=multipart`
      : `https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart`;
    const method = existingFileId ? 'PATCH' : 'POST';
    const res = await this._fetch(url, { method, body: form });
    return await res.json();
  },

  // Export all DB data to Drive
  async pushToDrive() {
    const keys = await DB.keys();
    const data = {};
    for (const k of keys) data[k] = await DB.get(k);
    data.__sync_ts = Date.now();
    const existing = await this.findFile();
    await this.uploadFile(data, existing?.id || null);
    localStorage.setItem('gdrive_last_push', String(Date.now()));
    return true;
  },

  // Download from Drive and merge (newer wins per key)
  async pullFromDrive() {
    const existing = await this.findFile();
    if (!existing) return { merged: 0, status: 'no_file' };
    const remote = await this.downloadFile(existing.id);
    const remoteTs = remote.__sync_ts || 0;
    const localTs = parseInt(localStorage.getItem('gdrive_last_push') || '0');
    // merge: for each key, keep the more recent version
    let merged = 0;
    for (const [k, v] of Object.entries(remote)) {
      if (k.startsWith('__')) continue;
      const local = await DB.get(k);
      if (!local) { await DB.set(k, v); merged++; }
      // if both exist, remote wins only if remote is strictly newer
      else if (remoteTs > localTs) { await DB.set(k, v); merged++; }
    }
    return { merged, status: 'ok' };
  },
};

// ─── DRIVE STATUS BADGE (sidebar) ────────────────────────────────────────────
function DriveStatusBadge({ C, clientId }) {
  const [connected, setConnected] = useState(() => GDrive.isConnected());
  const [syncing, setSyncing] = useState(false);
  const [msg, setMsg] = useState('');
  const [lastSync, setLastSync] = useState(() => {
    const t = localStorage.getItem('gdrive_last_push');
    return t ? new Date(parseInt(t)) : null;
  });

  function showMsg(m, dur=3000) { setMsg(m); setTimeout(() => setMsg(''), dur); }

  async function connect() {
    if (!clientId) { showMsg('Configure o Client ID nas Configurações'); return; }
    GDrive.init(clientId);
    try {
      setSyncing(true);
      await GDrive.requestToken();
      setConnected(true);
      // pull on connect
      const { merged, status } = await GDrive.pullFromDrive();
      if (status === 'ok') showMsg(`↓ ${merged} registros importados`);
      else showMsg('Drive conectado! Nenhum backup encontrado.');
      const t = localStorage.getItem('gdrive_last_push');
      if (t) setLastSync(new Date(parseInt(t)));
    } catch(e) {
      showMsg(e.message || 'Erro ao conectar');
    } finally { setSyncing(false); }
  }

  function disconnect() {
    GDrive.disconnect();
    setConnected(false);
    showMsg('Desconectado');
  }

  async function manualSync() {
    setSyncing(true);
    try {
      await GDrive.pushToDrive();
      const now = new Date();
      setLastSync(now);
      showMsg('✓ Sincronizado!');
    } catch(e) { showMsg(e.message || 'Erro ao sincronizar'); }
    finally { setSyncing(false); }
  }

  const fmtTime = (d) => d ? `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}` : null;

  if (!connected) {
    return (
      <div style={{ padding:'0 10px 4px' }}>
        <button onClick={connect} disabled={syncing}
          style={{ width:'100%', display:'flex', alignItems:'center', gap:8, background:'none',
            border:`1px solid ${C.border}`, borderRadius:8, padding:'7px 12px', cursor:'pointer',
            color:C.textMid, fontSize:12, fontWeight:600, fontFamily:'inherit' }}>
          <span style={{ fontSize:14 }}>☁</span>
          {syncing ? 'Conectando…' : 'Conectar Google Drive'}
        </button>
        {msg && <div style={{ fontSize:11, color:C.warning, marginTop:5, paddingLeft:4 }}>{msg}</div>}
      </div>
    );
  }

  return (
    <div style={{ padding:'0 10px 4px' }}>
      <div style={{ display:'flex', alignItems:'center', gap:6, padding:'7px 10px',
        background:`${C.success}12`, border:`1px solid ${C.success}33`, borderRadius:8 }}>
        <span style={{ fontSize:12 }}>☁</span>
        <div style={{ flex:1, minWidth:0 }}>
          <div style={{ fontSize:11, fontWeight:700, color:C.success }}>Drive Conectado</div>
          {lastSync && <div style={{ fontSize:10, color:C.textSub }}>Sync: {fmtTime(lastSync)}</div>}
        </div>
        <button onClick={manualSync} disabled={syncing} title="Sincronizar agora"
          style={{ background:'none', border:'none', cursor:'pointer', color:C.success, fontSize:14, padding:'0 2px',
            opacity: syncing ? 0.5 : 1 }}>
          {syncing ? '↻' : '↑'}
        </button>
        <button onClick={disconnect} title="Desconectar"
          style={{ background:'none', border:'none', cursor:'pointer', color:C.textSub, fontSize:13, padding:'0 2px' }}>
          ×
        </button>
      </div>
      {msg && <div style={{ fontSize:11, color:C.accent, marginTop:4, paddingLeft:4 }}>{msg}</div>}
    </div>
  );
}

      </aside>

      {/* ── MAIN CONTENT ── */}
      <main style={{flex:1,height:'100vh',background:C.bg,display:'flex',flexDirection:'column',overflowY:'auto'}}>
        {screen==='hoje'         && <TodayScreen C={C} dark={dark}/>}
        {screen==='calendario'   && <CalendarScreen C={C}/>}
        {screen==='estatisticas' && <StatsScreen C={C} dailyGoalOverride={dailyGoalOverride}/>}
        {screen==='config'       && <SettingsScreen C={C} dark={dark} onToggleDark={toggleDark} dailyGoalOverride={dailyGoalOverride} onSetDailyGoal={handleSetDailyGoal} driveClientId={driveClientId} onSetDriveClientId={handleSetDriveClientId}/>}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
